<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="Insidor - what is going viral, and the coins made from it.">
<title>Insidor</title>
<style>h1,h2,h3,h4,h5,p{margin:0}input,button{font:inherit;color:inherit}</style>
<style>
/* ===========================================================
   INSIDOR - one complete app.
   Real viral moments. Search everywhere. Simple = cards.
   Pro = the same objects, denser, with trading columns.
   =========================================================== */
:root{
  --bg0:#060607; --bg1:#0C0C0E; --bg2:#131316; --bg3:#1A1A1E; --bg4:#222228;
  --line:#212127; --line2:#2E2E36;
  --ink:#F4F5F7; --muted:#8A8A93; --dim:#5A5A62;
  --ion:#3DE0FF; --ionw:rgba(61,224,255,.10); --ionb:rgba(61,224,255,.32);
  --lime:#9BF03C; --limew:rgba(155,240,60,.10); --limeb:rgba(155,240,60,.32);
  --red:#FF5C6E; --redw:rgba(255,92,110,.10);
  --amber:#FFB84D; --amberw:rgba(255,184,77,.11);
  --disp:"Clash Display","Avenir Next",-apple-system,system-ui,sans-serif;
  --sans:"General Sans","Avenir Next",-apple-system,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --ez:cubic-bezier(.2,0,0,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg0);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input{font:inherit}
:focus-visible{outline:1.5px solid var(--ion);outline-offset:2px;border-radius:6px}
.m{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--lime)} .dn{color:var(--red)} .dm{color:var(--dim)} .mu{color:var(--muted)}
/* mode gates must outrank component display rules like .grid4{display:grid} and .mini .r,
   so they are compound selectors rather than single classes */
body:not([data-m="pro"]) .oP{display:none}
body[data-m="pro"] .oS{display:none}

/* == HEADER == */
.nav{position:sticky;top:0;z-index:60;background:var(--bg0);border-bottom:1px solid var(--line);
  height:58px;display:flex;align-items:center;gap:16px;padding:0 16px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-size:15px;font-weight:600;
  letter-spacing:.07em;flex:none;cursor:pointer}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--ion);box-shadow:0 0 10px rgba(61,224,255,.7)}
.tabs{display:flex;gap:2px;flex:none}
.tabs button{height:32px;padding:0 12px;border-radius:8px;color:var(--muted);font-weight:500;font-size:13.5px;
  white-space:nowrap;transition:all 150ms var(--ez)}
.tabs button:hover{color:var(--ink);background:var(--bg2)}
.tabs button.on{color:var(--ink);background:var(--bg2)}
.srch{flex:1;min-width:120px;max-width:440px;height:36px;border:1px solid var(--line);border-radius:9px;
  background:var(--bg1);display:flex;align-items:center;gap:9px;padding:0 12px;
  transition:border-color 150ms var(--ez)}
.srch:focus-within{border-color:var(--ionb)}
.srch svg{flex:none;color:var(--dim)}
.srch input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font-size:13.5px;padding:0}
.srch input::placeholder{color:var(--dim)}
.srch input:focus{outline:none}
.srch .clr{color:var(--dim);font-size:16px;line-height:1;flex:none}
.srch .clr:hover{color:var(--ink)}
.nr{display:flex;align-items:center;gap:8px;flex:none}
.mode{display:flex;align-items:center;gap:8px;height:32px;padding:0 5px 0 11px;border:1px solid var(--line);
  border-radius:8px;color:var(--muted);font-size:12.5px}
.mode .sw{width:30px;height:17px;border-radius:9px;background:var(--bg4);position:relative}
.mode .sw::after{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;
  background:var(--dim);transition:transform 200ms var(--ez),background 190ms var(--ez)}
body[data-m="pro"] .mode{color:var(--ion);border-color:var(--ionb)}
body[data-m="pro"] .mode .sw{background:var(--ionw)}
body[data-m="pro"] .mode .sw::after{transform:translateX(13px);background:var(--ion)}
.ib{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.ib:hover{background:var(--bg2);color:var(--ink)}
.connect{height:32px;padding:0 15px;border-radius:8px;background:var(--ion);color:#04141a;font-weight:650;font-size:13px}
.connect:hover{filter:brightness(1.1)}
.wal{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;
  gap:7px;font-family:var(--mono);font-size:12px}
.wal b{color:var(--lime)}
.demo{background:var(--ionw);border-bottom:1px solid var(--ionb);padding:8px 16px;font-size:12.5px;
  color:var(--muted);display:flex;align-items:center;gap:10px}
.demo b{color:var(--ion)}
.demo button{margin-left:auto;color:var(--dim);font-size:11px;font-family:var(--mono)}

/* == SHELL == */
.wrap{max-width:1480px;margin:0 auto;padding:22px 16px 90px}
body:not([data-m="pro"]) .wrap{max-width:660px}
.vh{margin-bottom:18px}
.vt{font-family:var(--disp);font-size:25px;font-weight:600;letter-spacing:-.02em}
.vs{color:var(--muted);font-size:13.5px;margin-top:5px}
.back{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;margin-bottom:14px;
  font-family:var(--mono)}
.back:hover{color:var(--ink)}
.pills{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.pill{height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--line);color:var(--muted);
  font-size:12.5px;transition:all 150ms var(--ez)}
.pill:hover{border-color:var(--line2);color:var(--ink)}
.pill.on{background:var(--bg2);border-color:var(--line2);color:var(--ink);font-weight:600}
.pill.only.on{border-color:var(--ionb);color:var(--ion);background:var(--ionw)}

/* == SIMPLE CARD == */
.card{border:1px solid var(--line);border-radius:13px;background:var(--bg1);overflow:hidden;margin-bottom:13px}
.card:hover{border-color:var(--line2)}
.hero{width:100%;aspect-ratio:2.4/1;position:relative;display:block;border:0;padding:0;cursor:pointer}
.hero .plt{position:absolute;right:11px;top:11px;width:26px;height:26px;border-radius:8px;
  background:rgba(6,6,7,.8);display:grid;place-items:center;color:var(--ink)}
.hero .st{position:absolute;left:11px;bottom:11px;height:26px;padding:0 10px;border-radius:8px;
  background:rgba(6,6,7,.8);display:flex;align-items:center;gap:7px;font-size:12px}
.cb{padding:15px 17px 17px}
.crow{display:flex;align-items:center;gap:9px;margin-bottom:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.crow b{color:var(--ink);font-weight:600}
.crow .when{margin-left:auto;color:var(--dim);font-size:12.5px}
.ctit{font-size:18px;line-height:1.35;font-weight:600;letter-spacing:-.012em;margin-bottom:8px}
.cwhy{font-size:14px;color:var(--muted);line-height:1.55;margin-bottom:12px}
.facts{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.f{height:29px;padding:0 11px;border-radius:8px;background:var(--bg2);display:inline-flex;align-items:center;
  gap:6px;font-size:12.5px;color:var(--muted)}
.f b{color:var(--ink);font-weight:620}
.f.g{background:var(--limew);color:var(--lime)} .f.g b{color:var(--lime)}
.f.w{background:var(--amberw);color:var(--amber)} .f.w b{color:var(--amber)}
.f.i{background:var(--ionw);color:var(--ion)} .f.i b{color:var(--ion)}
.cact{display:flex;gap:9px;flex-wrap:wrap}
.risk{font-size:12.5px;color:var(--dim);margin-top:10px;line-height:1.5}

.btn{height:42px;padding:0 17px;border-radius:10px;font-weight:650;font-size:14px;border:1px solid var(--line2);
  color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:7px;
  transition:all 150ms var(--ez);white-space:nowrap}
.btn:hover{border-color:var(--dim);color:var(--ink);background:var(--bg2)}
.btn.ion{background:var(--ion);border-color:var(--ion);color:#04141a}
.btn.ion:hover{filter:brightness(1.1);background:var(--ion);color:#04141a}
.btn.lime{background:var(--lime);border-color:var(--lime);color:#0a1400}
.btn.lime:hover{filter:brightness(1.1);background:var(--lime);color:#0a1400}
.btn.red{background:var(--red);border-color:var(--red);color:#1a0206}
.btn.f1{flex:1}
.btn.sm{height:30px;font-size:12.5px;padding:0 11px;border-radius:7px}
.btn.on{border-color:var(--ionb);color:var(--ion);background:var(--ionw)}
.btn[disabled]{opacity:.4;cursor:default}

/* == PRO TABLE == */
.tblwrap{border:1px solid var(--line);border-radius:11px;background:var(--bg1);overflow:auto}
table{width:100%;border-collapse:collapse;min-width:1080px}
th{position:sticky;top:0;background:var(--bg1);z-index:2;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:400;text-align:right;
  padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th:first-child{text-align:left;padding-left:14px}
th:hover{color:var(--ink)}
th.srt{color:var(--ion)}
td{padding:0 10px;height:44px;border-bottom:1px solid rgba(33,33,39,.7);text-align:right;white-space:nowrap;
  font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
td:first-child{text-align:left;padding-left:14px;font-family:var(--sans)}
tbody tr{cursor:pointer;transition:background 130ms var(--ez)}
tbody tr:hover{background:var(--bg2)}
tbody tr.nc{background:rgba(61,224,255,.04)}
tbody tr.nc:hover{background:rgba(61,224,255,.09)}
.tid{display:flex;align-items:center;gap:10px}
.av{width:30px;height:30px;border-radius:8px;flex:none;border:1px solid var(--line)}
.tk{font-weight:650;font-size:13.5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tn{font-size:11.5px;color:var(--dim);margin-top:1px;max-width:230px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;padding:2px 6px;border-radius:5px;
  border:1px solid var(--line2);color:var(--dim)}
.tag.i{border-color:var(--ionb);color:var(--ion);background:var(--ionw)}
.tag.l{border-color:var(--limeb);color:var(--lime);background:var(--limew)}
.tag.a{border-color:rgba(255,184,77,.4);color:var(--amber);background:var(--amberw)}
.spk{width:56px;height:20px;vertical-align:middle}
.spk path{fill:none;stroke-width:1.4}

/* == STORY / TOKEN PAGE == */
.panel{border:1px solid var(--line);border-radius:12px;background:var(--bg1);overflow:hidden;margin-bottom:14px}
.ptit{padding:12px 16px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:10.5px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center}
.ptit .r{margin-left:auto;text-transform:none;letter-spacing:0;color:var(--muted)}
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.thead{display:flex;align-items:center;gap:13px;padding:16px}
.thead .av{width:46px;height:46px;border-radius:12px}
.tbig{font-family:var(--disp);font-size:26px;font-weight:600;letter-spacing:-.02em;display:flex;
  align-items:center;gap:10px;flex-wrap:wrap}
.tpx{margin-left:auto;text-align:right}
.tpx .p{font-family:var(--mono);font-size:21px;font-weight:600}
.tpx .c{font-family:var(--mono);font-size:13px;margin-top:2px}
.ledger{display:flex;align-items:flex-start;gap:11px;padding:12px 16px;background:var(--limew);
  border-top:1px solid var(--limeb);border-bottom:1px solid var(--limeb);font-size:13.5px;color:var(--muted)}
.ledger b{color:var(--lime)} .ledger q{color:var(--dim);font-style:italic}
.ledger a{margin-left:auto;color:var(--lime);font-weight:600;white-space:nowrap;cursor:pointer;flex:none;font-size:13px}
.ledger.o{background:var(--ionw);border-color:var(--ionb)}
.ledger.o b,.ledger.o a{color:var(--ion)}
.kpis{display:flex;border-top:1px solid var(--line);flex-wrap:wrap}
.kpis div{flex:1;min-width:104px;padding:11px 15px;border-right:1px solid var(--line)}
.kpis .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.kpis .v{font-family:var(--mono);font-size:13.5px;margin-top:3px}
.chartbox{height:260px;padding:14px;border-top:1px solid var(--line);position:relative}
.chartbox canvas{width:100%;height:100%;display:block}
.safe{display:flex;gap:11px;padding:14px 16px;border-top:1px solid var(--line);align-items:flex-start}
.safe .g{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none}
.safe .g.ok{background:var(--limew);color:var(--lime)}
.safe .g.wn{background:var(--amberw);color:var(--amber)}
.safe .tt{font-weight:620;font-size:14px}
.safe .ds{font-size:13px;color:var(--muted);margin-top:2px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.grid4 div{padding:10px 13px;border-right:1px solid var(--line)}
.grid4 div:last-child{border-right:0}
.grid4 .k{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.grid4 .v{font-family:var(--mono);font-size:12px;margin-top:2px}
/* trade */
.sides{display:flex;gap:6px;padding:13px 13px 0}
.sides button{flex:1;height:36px;border-radius:9px;font-weight:650;font-size:14px;color:var(--muted);
  border:1px solid var(--line)}
.sides button.on[data-side="buy"]{background:var(--lime);border-color:var(--lime);color:#0a1400}
.sides button.on[data-side="sell"]{background:var(--red);border-color:var(--red);color:#1a0206}
.fp{padding:12px 13px;border-bottom:1px solid var(--line)}
.lbl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px;color:var(--muted);
  margin-bottom:7px}
.lbl b{color:var(--ink)}
.amt{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;background:var(--bg0);
  padding:10px 12px}
.amt:focus-within{border-color:var(--ion)}
.amt input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font-family:var(--mono);font-size:19px;
  font-weight:600;padding:0}
.amt input:focus{outline:none}
.amt .u{font-family:var(--mono);font-size:12px;color:var(--dim)}
.pre{display:flex;gap:5px;margin-top:9px}
.pre button{flex:1;height:28px;border:1px solid var(--line);border-radius:7px;font-family:var(--mono);
  font-size:11.5px;color:var(--muted)}
.pre button:hover,.pre button.on{border-color:var(--ionb);color:var(--ion);background:var(--ionw)}
.recv{padding:12px 13px;background:var(--bg2);border-bottom:1px solid var(--line);display:flex;
  justify-content:space-between;align-items:baseline}
.recv .k{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.recv .v{font-family:var(--mono);font-size:17px;font-weight:600}
.mini{padding:10px 13px;display:grid;gap:5px}
.mini .r{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px}
.mini .r span:first-child{color:var(--dim)}
.doit{margin:12px 13px 13px;height:44px;width:calc(100% - 26px);border-radius:10px;font-weight:700;
  font-size:15px;background:var(--lime);color:#0a1400}
.doit:hover{filter:brightness(1.1)}
.doit.s{background:var(--red);color:#1a0206}
.fine{padding:0 13px 13px;font-family:var(--mono);font-size:10.5px;color:var(--dim);text-align:center}
.posn{padding:13px 16px;border-top:1px solid var(--line);background:var(--bg2)}
.posn .k{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.posn .v{font-family:var(--mono);font-size:21px;font-weight:600;margin-top:3px}
.posn .s{font-size:12.5px;color:var(--muted);margin-top:3px}
.posn .e{color:var(--lime);font-family:var(--mono);font-size:12px;margin-top:4px}
/* timeline */
.tl{padding:14px 16px}
.tl .r{display:flex;gap:13px;position:relative;padding-bottom:15px}
.tl .r:last-child{padding-bottom:0}
.tl .r::before{content:'';position:absolute;left:5px;top:14px;bottom:-1px;width:1px;background:var(--line)}
.tl .r:last-child::before{display:none}
.tl .pip{width:11px;height:11px;border-radius:50%;border:2px solid var(--line2);background:var(--bg1);flex:none;
  margin-top:3px;z-index:1}
.tl .r.us .pip{border-color:var(--lime);background:var(--lime)}
.tl .r.bad .pip{border-color:var(--red);background:var(--red)}
.tl .t{font-family:var(--mono);font-size:11.5px;color:var(--muted);width:88px;flex:none}
.tl .w b{font-size:13.5px;font-weight:600}
.tl .w .s{font-size:12.5px;color:var(--dim);margin-top:2px;line-height:1.5}
.crow2{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);
  border-radius:11px;background:var(--bg1);margin-bottom:8px;cursor:pointer}
.crow2:hover{border-color:var(--line2);background:var(--bg2)}
.crow2.big{border-color:var(--limeb);background:var(--limew)}
.crow2 .id{min-width:0;flex:1}
.crow2 .r{text-align:right;flex:none;font-family:var(--mono)}
.sect{font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);
  margin:20px 0 10px;display:flex;align-items:center;gap:10px}
.sect .ln{flex:1;height:1px;background:var(--line)}
.empty{border:1px dashed var(--line2);border-radius:12px;padding:38px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;font-family:var(--disp);font-size:17px;color:var(--ink);font-weight:600;margin-bottom:7px}

/* == MODALS == */
.scrim{position:fixed;inset:0;background:rgba(4,4,5,.8);-webkit-backdrop-filter:blur(4px);
  backdrop-filter:blur(4px);z-index:120;display:grid;place-items:start center;padding:4vh 16px;
  overflow-y:auto;animation:fi 140ms var(--ez)}
@keyframes fi{from{opacity:0}to{opacity:1}}
.modal{width:540px;max-width:100%;background:var(--bg1);border:1px solid var(--line2);border-radius:14px;
  box-shadow:0 30px 80px rgba(0,0,0,.8);overflow:hidden;animation:mi 220ms var(--ez)}
@keyframes mi{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
.mh{display:flex;align-items:center;gap:11px;padding:15px 17px;border-bottom:1px solid var(--line)}
.mh .t{font-family:var(--disp);font-size:16.5px;font-weight:600}
.mh .x{margin-left:auto}
.mb{padding:17px}
.mb h5{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
  margin:16px 0 7px}
.mb h5:first-child{margin-top:0}
.mb p{color:var(--muted);font-size:13.5px;margin-bottom:9px}
.mb p b{color:var(--ink)}
.gen{border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:14px}
.genh{padding:10px 12px;background:var(--bg2);border-bottom:1px solid var(--line);display:flex;align-items:center;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.genh .r{margin-left:auto;color:var(--ion);cursor:pointer;text-transform:none;letter-spacing:0;font-size:11.5px}
.gp{display:flex;align-items:center;gap:12px;padding:13px 12px}
.gp .im{width:52px;height:52px;border-radius:10px;flex:none;border:1px solid var(--line)}
.gp .tkb{font-family:var(--mono);font-size:20px;font-weight:700}
.gp .nmb{font-size:13px;color:var(--muted);margin-top:2px}
.why2{padding:0 12px 11px;font-family:var(--mono);font-size:10.5px;color:var(--dim);line-height:1.55}
.why2 b{color:var(--muted)}
.alts{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 12px}
.alt{height:29px;padding:0 10px;border:1px solid var(--line);border-radius:7px;font-family:var(--mono);

/* \u2550\u2550\u2550\u2550 SEARCH \u2550\u2550\u2550\u2550 */
function search(q){
  q=q.toLowerCase().trim();
  if(!q) return {st:[],cn:[]};
  return {
    st:ST.filter(function(s){return (s.title+' '+s.who+' '+s.at+' '+s.cat+' '+s.why).toLowerCase().indexOf(q)>-1;}),
    cn:CN.filter(function(c){return (c.t+' '+c.n).toLowerCase().indexOf(q)>-1;})
  };
}
function visible(){
  var l=ST.slice();
  if(S.cat!=='All') l=l.filter(function(x){return x.cat===S.cat;});
  if(S.noCoin) l=l.filter(function(x){return !coinsOf(x.id).length;});
  return l;
}

function spark(up){var p=[],y=9;for(var i=0;i<=56;i+=7){y+=Math.sin(i/6)*1.7+(up?-.9:.9);
  p.push(i+','+Math.max(2,Math.min(18,y)).toFixed(1));}
  return '<svg class="spk" viewBox="0 0 56 20"><path d="M'+p.join(' L')+'" style="stroke:var(--'+(up?'lime':'red')+')"/></svg>';}

      '<div class="mini"><div class="r oS"><span>Fees</span><span>~1% + network</span></div>'+
        '<div class="r oP"><span>Min received</span><span id="minr">-</span></div>'+
        '<div class="r oP"><span>Price impact</span><span class="up">0.21%</span></div>'+
        '<div class="r oP"><span>Network</span><span>0.0005 SOL</span></div></div>'+

        (S.side==='buy'?'Buy $':'Sell $')+c.t+'</button>'+
      '<div class="fine">You sign in your own wallet</div>'+
      (h?'<div class="posn"><div class="k">Your position</div><div class="v">'+money(worth)+'</div>'+
        '<div class="s">Put in '+money(h.paid)+' &middot; '+(pl>=0?'up ':'down ')+money(Math.abs(pl))+'</div></div>':'')+
    '</div></div></div>';
  chart(c); recalc();
}
function recalc(){
  var c=cn(S.arg); if(!c||!$('#amt'))return;
  var a=parseFloat($('#amt').value||'0')||0,u=a/c.px;
  $('#recv').textContent=a?Math.round(u).toLocaleString()+' '+c.t:'-';
  var m=$('#minr'); if(m)m.textContent=a?Math.round(u*.99).toLocaleString():'-';
}
function chart(c){
  var cv=$('#cv'); if(!cv)return;
  var w=cv.clientWidth,ht=cv.clientHeight,dpr=window.devicePixelRatio||1;
  cv.width=w*dpr;cv.height=ht*dpr;var x=cv.getContext('2d');x.scale(dpr,dpr);x.clearRect(0,0,w,ht);
  var cs=getComputedStyle(document.documentElement);
  var line=cs.getPropertyValue('--line').trim(),lime=cs.getPropertyValue('--lime').trim(),
      red=cs.getPropertyValue('--red').trim(),ion=cs.getPropertyValue('--ion').trim();
  x.strokeStyle=line;x.lineWidth=1;
  for(var i=1;i<4;i++){var y=Math.round(ht/4*i)+.5;x.beginPath();x.moveTo(0,y);x.lineTo(w,y);x.stroke();}
  var pts=[],p=100,dir=c.c24>=0?1:-1;
  for(var k=0;k<72;k++){p+=Math.sin(k/6)*2.3+(Math.random()-.5)*2.6+dir*.3;pts.push(p);}
  var mn=Math.min.apply(null,pts),mx=Math.max.apply(null,pts);
  var X=function(i){return i/(pts.length-1)*w;},Y=function(v){return ht-10-((v-mn)/(mx-mn||1))*(ht-24);};
  if(S.m==='pro'){var n=48,bw=w/n;
    for(var j=0;j<n;j++){var o=pts[j],cl=pts[j+1]||o,hi=Math.max(o,cl)+1.3,lo=Math.min(o,cl)-1.3;
      var cx=j*bw+bw/2,rise=cl>=o;x.strokeStyle=rise?lime:red;x.fillStyle=rise?lime:red;
      x.beginPath();x.moveTo(cx,Y(hi));x.lineTo(cx,Y(lo));x.stroke();
      var t=Y(Math.max(o,cl)),b=Y(Math.min(o,cl));x.fillRect(cx-bw*.3,t,bw*.6,Math.max(1,b-t));}
  }else{
    x.beginPath();pts.forEach(function(v,i){i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v));});
    x.strokeStyle=ion;x.lineWidth=2;x.lineJoin='round';x.stroke();
    x.lineTo(w,ht);x.lineTo(0,ht);x.closePath();
    var gr=x.createLinearGradient(0,0,0,ht);
    gr.addColorStop(0,'rgba(61,224,255,.15)');gr.addColorStop(1,'rgba(61,224,255,0)');
    x.fillStyle=gr;x.fill();}
}

/* \u2550\u2550\u2550\u2550 NAV \u2550\u2550\u2550\u2550 */
var NAV=[['trending','Trending'],['search','Search'],['new','New pairs'],['watch','Watchlist'],['portfolio','Portfolio']];
function paintTabs(){
  $('#tabs').innerHTML=NAV.map(function(n){
    var on=n[0]===S.v||((S.v==='story'||S.v==='coin')&&n[0]==='trending');
    return '<button class="'+(on?'on':'')+'" data-go="'+n[0]+'">'+n[1]+'</button>';}).join('');}
function paintWallet(){
  $('#walSlot').innerHTML=S.wallet?'<span class="wal"><b>'+money(S.bal)+'</b></span>'
    :'<button class="connect" data-go="wallet">Connect</button>';}
function go(v,arg){
  if(v==='make')return sheetMake(arg);
  if(v==='wallet')return sheetWallet();
  if(v==='ext')return toast('This would open the original post');
  S.v=v;S.arg=arg;paintTabs();
  if(v==='trending')vTrending();
  else if(v==='search')vSearch();
  else if(v==='new')vNew();
  else if(v==='watch')vWatch();
  else if(v==='portfolio')vPort();
  else if(v==='story')vStory(arg);
  else if(v==='coin')vCoin(arg);
  window.scrollTo({top:0});
}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-go]');
  if(t)return go(t.dataset.go,t.dataset.arg);
  var c=e.target.closest('[data-cat]');if(c){S.cat=c.dataset.cat;return vTrending();}
  var o=e.target.closest('[data-only]');if(o){S.noCoin=!S.noCoin;return vTrending();}
  var f=e.target.closest('[data-fol]');
  if(f){var id=f.dataset.fol;
    if(isFol(id)){S.follows=S.follows.filter(function(x){return x!==id;});toast('Removed');}
    else{S.follows.push(id);toast('Added to your watchlist');}
    return go(S.v,S.arg);}
  var sd=e.target.closest('[data-side]');if(sd){S.side=sd.dataset.side;return vCoin(S.arg);}
  var q=e.target.closest('[data-q]');
  if(q){$('#amt').value=q.dataset.q==='MAX'?String(S.bal):q.dataset.q;
    document.querySelectorAll('[data-q]').forEach(function(x){x.classList.toggle('on',x===q);});return recalc();}
  if(e.target.closest('[data-regen]'))return toast('Same four branches, different seed');
  if(e.target.closest('#doit')){
    var cc=cn(S.arg); if(!S.wallet)return sheetWallet();
    var a=parseFloat(($('#amt')||{}).value||'0')||0;
    if(S.side==='buy'){
      if(a<=0||a>S.bal)return toast('Not enough in your wallet');
      S.bal-=a;var h=holdOf(cc.id);
      if(h){h.units+=a/cc.px;h.paid+=a;}else S.holds.push({c:cc.id,units:a/cc.px,paid:a});
      paintWallet();vCoin(cc.id);return toast('Bought '+money(a)+' of $'+cc.t);
    } else {
      var hd=holdOf(cc.id); if(!hd)return toast('You do not own any $'+cc.t);
      var w=hd.units*cc.px;S.bal+=w;S.holds=S.holds.filter(function(x){return x!==hd;});
      paintWallet();vCoin(cc.id);return toast('Sold '+money(w));}
  }
});
document.addEventListener('input',function(e){if(e.target.id==='amt')recalc();});
$('#q').addEventListener('input',function(){
  S.q=this.value; $('#qx').style.display=this.value?'block':'none';
  if(S.q&&S.v!=='search'){go('search');$('#q').focus();}
  else if(S.v==='search')vSearch();});
$('#qx').addEventListener('click',function(){S.q='';$('#q').value='';this.style.display='none';go('trending');});
$('#modeBtn').addEventListener('click',function(){
  S.m=S.m==='simple'?'pro':'simple';document.body.dataset.m=S.m;go(S.v,S.arg);});
$('#helpBtn').addEventListener('click',sheetHelp);
$('#demoX').addEventListener('click',function(){$('#demo').style.display='none';});
addEventListener('keydown',function(e){
  if(e.key==='Escape')return close();
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#q').focus();}});
addEventListener('resize',function(){if(S.v==='coin')chart(cn(S.arg));});

document.body.dataset.m='simple';
paintTabs();paintWallet();go('trending');
})();
