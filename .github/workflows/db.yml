name: db

on:
  pull_request:
    paths: ['supabase/**', 'scripts/migrate.mjs', '.github/workflows/db.yml']
  push:
    branches: [main]

jobs:
  migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector image, because halfvec + HNSW are load-bearing in 0002/0003/0009.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: insidor_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/insidor_ci

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci

      # 1. Build from empty, in order.
      - name: apply migrations
        run: node scripts/migrate.mjs up

      # 2. IDEMPOTENCY PROOF. Every migration runs a second time and must be a
      #    no-op. This is the property the 24 loose schema-*.sql files never had.
      - name: re-apply (idempotency)
        run: node scripts/migrate.mjs verify

      # 3. ORDERING PROOF. Applying out of order must fail loudly.
      - name: ordering guard
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "delete from insidor.schema_migrations where version = '0004';"
          if node scripts/migrate.mjs up 2>&1 | tee /tmp/out; then
            echo "expected migrate to refuse out-of-order 0004"; exit 1
          fi
          grep -q "must be applied in ascending order" /tmp/out

      # 4. DRIFT PROOF. Editing an applied migration must be refused.
      - name: drift guard
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "update insidor.schema_migrations set checksum = 'tampered' where version = '0002';"
          if node scripts/migrate.mjs verify 2>&1 | tee /tmp/out2; then
            echo "expected migrate to refuse a drifted migration"; exit 1
          fi
          grep -q "Migrations are immutable once applied" /tmp/out2

      # 5. Snapshot diff. The checked-in schema.sql is the reviewable artefact;
      #    a migration that changes the schema without updating it fails here.
      - name: schema snapshot
        run: |
          docker run --rm --network host -e PGPASSWORD=postgres postgres:16 \
            pg_dump -h localhost -U postgres -d insidor_ci \
            --schema-only --no-owner --no-privileges --schema=public --schema=insidor \
            > /tmp/schema.sql
          diff -u supabase/schema.sql /tmp/schema.sql

  invariants:
    runs-on: ubuntu-latest
    needs: migrations
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: insidor_ci }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/insidor_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: node scripts/migrate.mjs up

      # Every constraint in §3 of the design gets a negative test: the CI job
      # asserts the bad write is REJECTED. A constraint with no failing test is
      # a constraint nobody has proved exists.
      - name: product-rule invariants
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/invariants.sql

      # The four hot queries must not regress into a Seq Scan or a Sort.
      - name: hot query plans
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/plans.sql
