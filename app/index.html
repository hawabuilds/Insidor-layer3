<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- There is no SEO surface here and nothing on this page is cacheable: every number is
         stale within a tick. So: no description, no OG tags, and an explicit noindex rather
         than a robots.txt someone has to remember exists. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="dark" />
    <title>Insidor</title>

    <!-- The three faces the design system names. Self-hosting them under /public/fonts is the
         intended end state (one fewer origin on the critical path of a table that repaints
         every tick); until then these are the canonical sources. The fallback stacks in
         tokens.css are what render if either origin is unreachable. -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=clash-display@600,500&f[]=general-sans@400,500,600&display=swap"
    />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
