<style>
/* ══════════════════════════════════════════════════════════
   INSIDOR — "Obsidian & Ion" terminal dark UI
   Graphite-black grounds · single ion-cyan UI accent · lime = on-chain/proof
   Velocity heat ramp = single-hue brightness climb (dim ash → ion)
   ══════════════════════════════════════════════════════════ */

:root {
  /* ground — graphite-black stack */
  --bg-0:#060607; --bg-1:#0C0C0E; --bg-2:#131316; --bg-3:#1A1A1E; --bg-4:#212127;
  --line:#212127; --line-2:#2C2C34;

  /* ink — near-white */
  --fg-0:#F4F5F7; --fg-1:#B4B4BD; --fg-2:#8A8A93; --fg-3:#5A5A62;

  /* UI chrome — ion cyan is the ONLY UI color */
  --ui-accent:#3DE0FF; --ui-accent-hi:#6BEBFF; --ui-accent-lo:#1FB8D8;
  --ui-accent-ink:#001318;

  /* THE HEAT RAMP — single-hue brightness climb: dim ash → full ion */
  --heat-1:#41505A; --heat-2:#2E8CA6; --heat-3:#2CC0E0; --heat-4:#3DE0FF;

  /* action = deploy / ignite — ion (only UI color) */
  --act:#3DE0FF; --act-hi:#6BEBFF; --act-lo:#1FB8D8; --act-ink:#001318;

  /* proof / on-chain / existing = lime */
  --cool:#9BF03C; --cool-dim:#77B82D;
  --down:#FF5C6E;

  --focus:#3DE0FF;
  --sel:rgba(61,224,255,.22);
  --glow:rgba(61,224,255,.20);
  --shadow:0 18px 48px rgba(0,0,0,.62);
  --scrim:rgba(4,4,6,.84);

  --disp:'Clash Display',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --ui:'General Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;

  --out:cubic-bezier(.16,1,.3,1);
  --std:cubic-bezier(.4,0,.2,1);
}

:root[data-theme="dark"] {
  --bg-0:#060607; --bg-1:#0C0C0E; --bg-2:#131316; --bg-3:#1A1A1E; --bg-4:#212127;
  --line:#212127; --line-2:#2C2C34;
  --fg-0:#F4F5F7; --fg-1:#B4B4BD; --fg-2:#8A8A93; --fg-3:#5A5A62;
  --ui-accent:#3DE0FF; --ui-accent-hi:#6BEBFF; --ui-accent-lo:#1FB8D8; --ui-accent-ink:#001318;
  --heat-1:#41505A; --heat-2:#2E8CA6; --heat-3:#2CC0E0; --heat-4:#3DE0FF;
  --act:#3DE0FF; --act-hi:#6BEBFF; --act-lo:#1FB8D8; --act-ink:#001318;
  --cool:#9BF03C; --cool-dim:#77B82D; --down:#FF5C6E;
  --sel:rgba(61,224,255,.22); --glow:rgba(61,224,255,.20);
  --shadow:0 18px 48px rgba(0,0,0,.62); --scrim:rgba(4,4,6,.84);
}
:root[data-theme="light"] {
  --bg-0:#EEF1F6; --bg-1:#FFFFFF; --bg-2:#F3F6FB; --bg-3:#FFFFFF; --bg-4:#E6EBF3;
  --line:#DDE3EC; --line-2:#C6CEDA;
  --fg-0:#0A0C10; --fg-1:#3B424E; --fg-2:#646B78; --fg-3:#9AA2AF;
  --ui-accent:#0F9FC4; --ui-accent-hi:#12B4DE; --ui-accent-lo:#0B84A3; --ui-accent-ink:#F4FDFF;
  --heat-1:#9FB0B8; --heat-2:#4FB8D2; --heat-3:#22B7DC; --heat-4:#0F9FC4;
  --act:#0F9FC4; --act-hi:#12B4DE; --act-lo:#0B84A3; --act-ink:#F4FDFF;
  --cool:#5FA30F; --cool-dim:#B8DF86; --down:#E0455A;
  --sel:rgba(15,159,196,.16); --glow:rgba(15,159,196,.16);
  --shadow:0 18px 48px rgba(30,40,60,.16); --scrim:rgba(238,241,246,.82);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg-0);color:var(--fg-0);
  font-family:var(--ui);font-size:13px;line-height:1.5;letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow:hidden;
}
::selection{background:var(--sel)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
button{font:inherit;background:none;border:none;color:inherit;cursor:pointer;padding:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}

/* ═══════════ SHELL ═══════════ */
.shell{display:flex;flex-direction:column;height:100vh;min-height:0}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) 520px;flex:1;min-height:0}

/* ═══════════ TOP BAR ═══════════ */
.topbar{
  display:grid;grid-template-columns:minmax(140px,1fr) auto minmax(140px,1fr);
  align-items:center;gap:16px;height:52px;padding:0 20px;
  border-bottom:1px solid var(--line);flex:none;background:var(--bg-0);z-index:50
}
.topbar-brand{
  justify-self:start;display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;color:inherit
}
.brand-mark{width:20px;height:20px;border-radius:5px;position:relative;flex:none;
  background:linear-gradient(145deg,var(--ui-accent),var(--heat-3))}
.brand-mark::after{content:'';position:absolute;inset:6px;border-radius:1px;background:var(--bg-0);opacity:.88}
:root[data-theme="light"] .brand-mark::after{background:#fff}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .brand-mark::after{background:#fff}}
.brand-name{
  font-family:var(--disp);font-size:15px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-0)
}

.topbar-nav{
  justify-self:center;display:flex;align-items:center;gap:32px;
  padding:0;background:transparent;border:none;border-radius:0;
  max-width:100%;overflow-x:auto;scrollbar-width:none;height:52px
}
.topbar-nav::-webkit-scrollbar{display:none}

.topbar-actions{
  justify-self:end;display:flex;align-items:center;gap:8px;min-width:0
}

/* ═══════════ SUB BAR (sources + stats) ═══════════ */
.subbar{
  display:flex;align-items:center;gap:16px;height:36px;padding:0 20px;
  border-bottom:1px solid var(--line);flex:none;background:var(--bg-0);
  overflow-x:auto;scrollbar-width:none
}
.subbar::-webkit-scrollbar{display:none}
.subbar-stats{display:flex;align-items:center;gap:18px;flex:none}
.subbar.hidden{display:none}

/* ═══════════ NAV TABS — Axiom-style text links ═══════════ */
.nav-item{
  display:flex;align-items:center;height:52px;padding:0 2px;border-radius:0;
  color:var(--fg-2);transition:color 130ms var(--std),border-color 130ms var(--std);
  width:auto;text-align:left;font-size:13.5px;font-weight:500;white-space:nowrap;flex:none;
  border-bottom:2px solid transparent;margin-bottom:-1px;letter-spacing:-.015em
}
.nav-item:hover{color:var(--fg-0);background:transparent}
.nav-item[aria-current="true"]{
  color:var(--fg-0);background:transparent;box-shadow:none;font-weight:600;
  border-bottom-color:var(--ui-accent)
}

.ni{width:14px;display:grid;place-items:center;color:var(--fg-3);flex:none}

.live{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--fg-2);white-space:nowrap;letter-spacing:0}
.pip{width:6px;height:6px;border-radius:50%;background:var(--cool);flex:none;position:relative}
.pip::after{content:'';position:absolute;inset:-4px;border-radius:50%;background:var(--cool);opacity:.28;
  animation:ping 2.4s var(--out) infinite}
@keyframes ping{0%{transform:scale(.5);opacity:.5}70%,100%{transform:scale(1.6);opacity:0}}
.stat{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--fg-3);white-space:nowrap}
.stat b{color:var(--fg-0);font-weight:500}
.theme-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);color:var(--fg-2);
  display:grid;place-items:center;transition:color 130ms var(--std),border-color 130ms var(--std),background 130ms var(--std)}
.theme-btn:hover{color:var(--fg-0);border-color:var(--line-2);background:var(--bg-2)}

/* ═══════════ CENTER ═══════════ */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg-0)}
.bar{height:48px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line);flex:none;background:var(--bg-0)}
.seg{display:flex;background:var(--bg-2);border-radius:8px;padding:3px;gap:2px;border:1px solid var(--line)}
.seg button{height:28px;padding:0 14px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--fg-2);
  transition:background 150ms var(--std),color 150ms var(--std);display:flex;align-items:center;gap:7px;letter-spacing:-.01em}
.seg button[aria-pressed="true"]{background:var(--bg-4);color:var(--fg-0)}
.seg .fl{width:5px;height:5px;border-radius:50%;background:var(--cool)}
.seg button[aria-pressed="false"] .fl{background:var(--fg-3)}
.bar-title{font-size:12px;color:var(--fg-2);font-family:var(--mono);letter-spacing:0}
.bar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.newpill{display:flex;align-items:center;gap:7px;height:30px;padding:0 13px;border-radius:20px;
  background:var(--act);color:var(--act-ink);font-size:12.5px;font-weight:600;
  box-shadow:0 0 0 0 var(--glow);animation:pillin 260ms var(--out)}
@keyframes pillin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.newpill:hover{background:var(--act-hi)}
.newpill.hidden{display:none}
.icon-btn{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--fg-2);
  transition:background 130ms var(--std),color 130ms var(--std)}
.icon-btn:hover{background:var(--bg-2);color:var(--fg-0)}

#userAuth{display:flex;align-items:center;min-height:36px;position:relative}
.auth-menu{position:relative}
.auth-menu.open .auth-panel{display:block}
.auth-panel{
  display:none;position:absolute;top:calc(100% + 8px);right:0;z-index:50;
  width:min(320px,calc(100vw - 24px));padding:16px;border-radius:12px;
  background:var(--bg-2);border:1px solid var(--line-2);box-shadow:var(--shadow)
}
.auth-panel h3{font-size:14px;font-weight:600;color:var(--fg-0);margin-bottom:4px}
.auth-panel p{font-size:12px;color:var(--fg-2);margin-bottom:12px}
.auth-opt{
  width:100%;display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;
  border-radius:8px;border:1px solid var(--line);background:var(--bg-3);
  font-size:13px;font-weight:500;color:var(--fg-0);margin-bottom:8px;
  transition:background 130ms var(--std),border-color 130ms var(--std)
}
.auth-opt:hover{background:var(--bg-4);border-color:var(--line-2)}
.auth-opt .ico{width:22px;height:22px;display:grid;place-items:center;flex:none}
.auth-err{font-size:12px;color:var(--down);margin-top:4px;min-height:1.2em}
.user-chip{display:flex;align-items:center;gap:8px;height:36px;padding:0 4px 0 12px;border-radius:9px;background:var(--bg-2);border:1px solid var(--line)}
.user-name{font-size:13px;font-weight:600;color:var(--fg-0);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-logout{color:var(--fg-2)}
.wallet-btn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
.wallet-btn{
  display:flex;align-items:center;gap:9px;height:36px;padding:0 16px 0 12px;border-radius:9px;
  font-size:13px;font-weight:600;color:var(--ui-accent-ink);letter-spacing:-.01em;
  border:1px solid var(--ui-accent-lo);background:var(--ui-accent);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--ui-accent) 35%,transparent),0 8px 24px -10px color-mix(in srgb,var(--ui-accent) 55%,transparent);
  transition:background 140ms var(--std),border-color 140ms var(--std),box-shadow 140ms var(--std),transform 140ms var(--std)
}
.wallet-btn:hover{
  background:var(--ui-accent-hi);border-color:var(--ui-accent-hi);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--ui-accent-hi) 45%,transparent),0 10px 28px -8px color-mix(in srgb,var(--ui-accent) 65%,transparent);
  transform:translateY(-1px)
}
.wallet-btn .wi{
  width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none;
  background:color-mix(in srgb,var(--ui-accent-ink) 14%,transparent);color:var(--ui-accent-ink)
}
.wallet-btn .wl{font-weight:600}

.feed{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:6px 22px 90px;scrollbar-width:thin}
.feed::-webkit-scrollbar{width:8px}
.feed::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:4px}

/* ── narrative card ── */
.card{position:relative;background:transparent;border:none;border-radius:0;padding:0;margin-top:14px}
.card:hover{background:transparent}
.card.arrive{animation:cardin 340ms var(--out)}
@keyframes cardin{from{opacity:0;transform:translateY(-10px) scale(.99)}to{opacity:1;transform:none}}
.card.blazing .quote{border-color:color-mix(in srgb,var(--heat-4) 40%,var(--line))}
.card.blazing .quote::before{content:'';position:absolute;inset:-1px;border-radius:10px;pointer-events:none;
  box-shadow:0 0 0 1px var(--glow),0 0 26px -8px var(--glow);animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}

.crow{display:flex;align-items:center;gap:8px;min-width:0}
.quote .crow{margin-bottom:10px}
.pbadge{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none;
  background:var(--bg-3);border:1px solid var(--line);color:var(--fg-1)}
.pbadge.is-tiktok{color:var(--fg-0)}
.who{font-size:13px;font-weight:600;color:var(--fg-0);letter-spacing:-.02em}
.at{font-size:12px;color:var(--fg-2);font-family:var(--mono)}
.when{font-size:11px;color:var(--fg-3);font-family:var(--mono);margin-left:auto;flex:none}
.heat{display:flex;align-items:center;gap:8px;flex:none}
.heat-x{font-family:var(--mono);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.heat-track{width:56px;height:4px;border-radius:2px;background:var(--bg-4);overflow:hidden}
.heat-fill{display:block;height:100%;border-radius:2px;transform-origin:left;transform:scaleX(0);
  animation:heatgrow 620ms var(--out) forwards}
@keyframes heatgrow{to{transform:scaleX(1)}}

.quote{position:relative;display:flex;flex-direction:column;background:var(--bg-1);border:1px solid var(--line);
  border-radius:8px;padding:12px 14px;transition:border-color 150ms var(--std),background 150ms var(--std)}
.card:hover .quote{border-color:var(--line-2);background:var(--bg-2)}
.quote-row{display:flex;gap:12px;align-items:flex-start;min-width:0}
.qthumb{width:52px;height:52px;border-radius:6px;flex:none;position:relative;overflow:hidden}
.qbody{min-width:0;flex:1;display:flex;flex-direction:column;gap:10px}
.qtext{font-size:13px;line-height:1.55;color:var(--fg-1);margin:0;letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:nowrap;min-width:0}
.card-foot .qmeta{
  display:flex;align-items:center;gap:14px;margin:0;font-family:var(--mono);font-size:11px;color:var(--fg-2);
  flex:1;min-width:0;flex-wrap:nowrap;overflow:hidden}
.card-foot .qmeta span{display:flex;align-items:center;gap:4px;white-space:nowrap;flex:none}
.card-acts{display:flex;align-items:center;gap:8px;margin-left:auto;flex:none;flex-shrink:0;flex-wrap:nowrap}

.btn{height:32px;padding:0 14px;border-radius:8px;font-size:12.5px;font-weight:500;display:flex;
  align-items:center;gap:7px;transition:background 140ms var(--std),color 140ms var(--std),border-color 140ms var(--std);
  border:1px solid var(--line-2);color:var(--fg-1);white-space:nowrap;letter-spacing:-.01em}
.btn:hover{border-color:var(--fg-3);color:var(--fg-0);background:var(--bg-2)}
.btn-act{background:var(--act);border-color:var(--act);color:var(--act-ink)}
.btn-act:hover{background:var(--act-hi);border-color:var(--act-hi);color:var(--act-ink)}
.btn-act:active{background:var(--act-lo)}
.btn-cool{border-color:color-mix(in srgb,var(--cool) 34%,transparent);color:var(--cool)}
.btn-cool:hover{border-color:var(--cool);color:var(--cool);background:color-mix(in srgb,var(--cool) 8%,transparent)}
.btn[disabled]{opacity:.42;cursor:default}
.btn[disabled]:hover{background:none;border-color:var(--line-2);color:var(--fg-1)}
.rank{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--fg-3);
  width:22px;flex:none;font-variant-numeric:tabular-nums}
.rank.top{color:var(--act)}

/* ═══════════ RIGHT RAIL ═══════════ */
.rail{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--bg-0)}
.rail-bar{height:48px;display:flex;align-items:center;gap:9px;padding:0 16px;border-bottom:1px solid var(--line);flex:none}
.rail-t{font-size:13px;font-weight:600;letter-spacing:-.02em}
.rail-sub{font-family:var(--mono);font-size:11px;color:var(--fg-2)}
.rail-bar .icon-btn{margin-left:auto}
.rail-feed{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:10px 12px 80px;scrollbar-width:thin}
.rail-feed::-webkit-scrollbar{width:8px}
.rail-feed::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:4px}

/* research rail — unified post cards */
.note{margin-bottom:12px;transition:transform 180ms var(--out)}
.note.arrive{animation:notein 320ms var(--out)}
@keyframes notein{from{opacity:0;transform:translateY(-9px) scale(.985)}to{opacity:1;transform:none}}

.note-card{
  display:flex;flex-direction:column;gap:0;background:var(--bg-1);border:1px solid var(--line);
  border-radius:11px;padding:11px 12px 12px;overflow:hidden;
  transition:border-color 150ms var(--std),background 150ms var(--std),box-shadow 150ms var(--std)}
.note:hover .note-card{border-color:var(--line-2);background:var(--bg-2)}

.note-top{
  display:flex;align-items:center;gap:6px;min-width:0;margin-bottom:9px}
.note-top .pbadge{width:20px;height:20px;border-radius:5px;flex:none}
.note-id{min-width:0;flex:1;display:flex;align-items:baseline;gap:5px;overflow:hidden}
.note-top .who{font-size:12px;font-weight:600;color:var(--fg-0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-top .at{font-size:11px;color:var(--fg-2);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-top .when{font-size:10.5px;color:var(--fg-3);font-family:var(--mono);flex:none;margin-left:4px}
.note-x{
  width:20px;height:20px;border-radius:5px;color:var(--fg-3);opacity:0;flex:none;margin-left:2px;
  transition:opacity 130ms var(--std),background 130ms var(--std),color 130ms var(--std)}
.note:hover .note-x{opacity:1}
.note-x:hover{background:var(--bg-3);color:var(--fg-1)}

.note-mid{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:start;min-width:0}
.note-card .qthumb{width:48px;height:48px;border-radius:7px;grid-column:1;grid-row:1;position:relative;overflow:hidden}
.note-text{
  grid-column:2;grid-row:1;min-width:0;font-size:12.5px;line-height:1.48;color:var(--fg-1);margin:0;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

.note-foot{
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:nowrap;
  margin-top:10px;min-width:0}
.note-foot .qmeta{
  display:flex;align-items:center;gap:10px;margin:0;font-size:10.5px;color:var(--fg-2);font-family:var(--mono);
  flex:1;min-width:0;flex-wrap:nowrap;overflow:hidden}
.note-foot .qmeta span{white-space:nowrap;flex:none}

.note-acts{display:flex;align-items:center;gap:6px;margin-left:auto;flex:none;flex-shrink:0;flex-wrap:nowrap}
.note-acts .btn{height:32px;padding:0 11px;font-size:11.5px;border-radius:8px;gap:5px;width:auto;flex-shrink:0;white-space:nowrap}
.note-acts .btn svg{width:11px;height:11px;flex:none}

.srcchip-mini{position:absolute;right:3px;top:3px;height:15px;padding:0 4px;border-radius:3px;
  background:var(--scrim);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);font-family:var(--mono);
  font-size:8px;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-1);display:flex;align-items:center;
  border:1px solid var(--line);line-height:1;z-index:1}
.play-mini{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:22px;height:22px;
  border-radius:50%;background:var(--scrim);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  display:grid;place-items:center;color:var(--fg-0);z-index:1}
.dur-mini{position:absolute;right:3px;bottom:3px;font-family:var(--mono);font-size:8.5px;color:var(--fg-0);
  background:var(--scrim);border-radius:3px;padding:1px 3px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:1}

/* ═══════════ TOKEN SEARCH ═══════════ */
.ts-head{padding:20px 0 16px}
.ts-back{font-family:var(--mono);font-size:11.5px;color:var(--fg-2);display:flex;align-items:center;gap:6px;margin-bottom:14px}
.ts-back:hover{color:var(--fg-0)}
.ts-title{font-family:var(--disp);font-size:23px;line-height:1.24;font-weight:600;letter-spacing:-.01em;margin:0 0 10px;max-width:600px;text-wrap:balance}
.ts-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:6px;
  background:var(--bg-2);border:1px solid var(--line);font-family:var(--mono);font-size:11.5px;color:var(--fg-1)}
.tag.cool{color:var(--cool);border-color:color-mix(in srgb,var(--cool) 30%,transparent)}
.tokens{width:100%;border-collapse:collapse;margin-top:6px}
.tokens th{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3);
  text-align:left;font-weight:400;padding:10px 12px;border-bottom:1px solid var(--line)}
.tokens td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tokens tbody tr{cursor:pointer;transition:background 130ms var(--std)}
.tokens tbody tr:hover{background:var(--bg-2)}
.tsym{font-family:var(--mono);font-size:13.5px;font-weight:600;color:var(--fg-0)}
.tname{font-size:12.5px;color:var(--fg-2);margin-top:1px}
.tval{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.tdim{font-family:var(--mono);font-size:12px;color:var(--fg-2);font-variant-numeric:tabular-nums}
.tlead{font-family:var(--mono);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--cool)}
.tlead.slow{color:var(--fg-2);font-weight:400}
.spark{width:62px;height:22px;display:block}
.spark path{fill:none;stroke:var(--fg-2);stroke-width:1.4;stroke-linejoin:round}
.spark.up path{stroke:var(--act)}
.boot-msg{margin:28px auto;max-width:440px;background:var(--bg-1);border:1px solid var(--line);
  border-radius:11px;padding:18px 20px;text-align:center}
.boot-msg h4{font-size:15px;font-weight:600;margin-bottom:6px}
.boot-msg p{font-size:13px;line-height:1.55;color:var(--fg-2)}
.boot-msg code{font-family:var(--mono);font-size:11.5px;color:var(--act);display:block;margin-top:8px;
  word-break:break-word;text-align:left}
.note-empty{padding:40px 0;text-align:center}
.note-empty h4{font-size:16px;margin:0 0 6px}
.note-empty p{font-size:13px;color:var(--fg-2);margin:0}

/* ═══════════ MODAL ═══════════ */
.back{position:fixed;inset:0;background:var(--scrim);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:80;
  display:grid;place-items:center;padding:20px;overflow-y:auto;animation:fadein 140ms linear}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.sheet{width:520px;max-width:100%;background:var(--bg-3);border:1px solid var(--line-2);border-radius:14px;
  box-shadow:var(--shadow);animation:sheetin 240ms var(--out);overflow:hidden}
@keyframes sheetin{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
.sh-top{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.sh-kick{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-2)}
.sh-top .icon-btn{margin-left:auto}
.sh-body{padding:18px}
.sh-head{font-family:var(--disp);font-size:16px;line-height:1.38;font-weight:600;margin:0 0 16px;text-wrap:balance}

.name-grid{display:grid;grid-template-columns:1fr 168px;gap:12px;margin-bottom:10px}
.fl-wrap{background:var(--bg-2);border:1px solid var(--line);border-radius:9px;padding:9px 12px;
  transition:border-color 140ms var(--std)}
.fl-wrap:focus-within{border-color:var(--act)}
.fl-lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3);
  display:block;margin-bottom:3px}
.fl-wrap input{width:100%;background:none;border:0;color:var(--fg-0);font-family:var(--ui);
  font-size:18px;font-weight:600;letter-spacing:-.01em;padding:0}
.fl-wrap input:focus{outline:none}
#tick{font-family:var(--mono);text-transform:uppercase;letter-spacing:.02em}
.tick-row{display:flex;align-items:baseline;gap:2px}
.tick-row .dollar{font-family:var(--mono);font-size:18px;font-weight:600;color:var(--fg-3)}

.coll{display:flex;align-items:center;gap:8px;width:100%;height:36px;padding:0 12px;border-radius:8px;
  font-size:12.5px;margin-bottom:12px;text-align:left;border:1px solid transparent}
.coll.clear{color:var(--cool);background:color-mix(in srgb,var(--cool) 9%,transparent)}
.coll.check{color:var(--fg-2);background:var(--bg-2)}
.coll.taken{color:var(--act);background:color-mix(in srgb,var(--act) 10%,transparent);
  border-color:color-mix(in srgb,var(--act) 26%,transparent)}
.coll.taken:hover{background:color-mix(in srgb,var(--act) 17%,transparent)}
.coll .arr{margin-left:auto}

.alts{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.alts .lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3)}
.chip{height:27px;padding:0 11px;border-radius:7px;border:1px solid var(--line-2);background:var(--bg-2);
  font-family:var(--mono);font-size:12px;color:var(--fg-1);transition:all 130ms var(--std)}
.chip:hover{border-color:var(--fg-3);color:var(--fg-0)}
.chip.on{border-color:var(--act);color:var(--act);background:color-mix(in srgb,var(--act) 10%,transparent)}

.sh-row{display:flex;gap:12px;margin-bottom:16px}
.mini{flex:1}
.mini .fl-lab{margin-bottom:5px}
.buy{display:flex;gap:6px}
.buy .chip{flex:1;justify-content:center;display:flex;align-items:center}
.img-row{display:flex;gap:11px;align-items:center;margin-bottom:16px}
.img-row .th{width:56px;height:56px;border-radius:8px;flex:none;position:relative;overflow:hidden}
.img-row .m{font-size:12.5px;color:var(--fg-1)}
.img-row .m u{color:var(--fg-2);cursor:pointer;text-underline-offset:3px}
.img-row .m u:hover{color:var(--fg-0)}

.split{background:var(--bg-2);border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:16px}
.split-bar{height:7px;border-radius:4px;display:flex;gap:2px;overflow:hidden;margin-bottom:10px}
.split-bar i{display:block;height:100%}
.split-leg{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;color:var(--fg-1)}
.split-leg span{display:flex;align-items:center;gap:6px}
.sq{width:8px;height:8px;border-radius:2px}
.split-note{font-size:11.5px;line-height:1.5;color:var(--fg-2);margin-top:9px}

.sh-foot{display:flex;align-items:center;gap:12px;padding:14px 18px;border-top:1px solid var(--line);background:var(--bg-2)}
.cost{font-family:var(--mono);font-size:11px;color:var(--fg-2);flex:1}
.deploy-btn{height:42px;padding:0 22px;border-radius:9px;background:var(--act);color:var(--act-ink);
  font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;
  transition:background 140ms var(--std),transform 120ms var(--out)}
.deploy-btn:hover{background:var(--act-hi)}
.deploy-btn:active{transform:scale(.98);background:var(--act-lo)}

/* ── filed / share ── */
.done-wrap{padding:22px 18px}
.done-badge{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;margin-bottom:14px;
  background:color-mix(in srgb,var(--cool) 16%,transparent);color:var(--cool)}
.done-h{font-family:var(--disp);font-size:20px;font-weight:600;letter-spacing:-.01em;margin:0 0 6px}
.done-p{font-size:13px;color:var(--fg-2);margin:0 0 18px}
.ca-row{display:flex;align-items:center;gap:9px;background:var(--bg-2);border:1px solid var(--line);
  border-radius:8px;padding:9px 12px;margin-bottom:18px}
.ca-row code{font-family:var(--mono);font-size:11.5px;color:var(--fg-1);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* the share card — the thing they post */
.share{border-radius:11px;overflow:hidden;border:1px solid var(--line-2);margin-bottom:14px}
.share-img{aspect-ratio:1200/560;position:relative;display:flex;align-items:flex-end;padding:14px}
.share-img::after{content:'';position:absolute;inset:0;
  background:linear-gradient(to top,rgba(6,7,10,.88) 0%,rgba(6,7,10,.25) 55%,transparent 100%)}
.share-quote{position:relative;z-index:1;font-size:14px;line-height:1.45;font-weight:500;color:#F2F4F8;
  max-width:88%;text-shadow:0 1px 12px rgba(0,0,0,.6);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.share-b{background:var(--bg-2);padding:13px 14px;display:flex;align-items:center;gap:12px}
.share-l{min-width:0;flex:1}
.share-tick{font-family:var(--mono);font-size:16px;font-weight:700;letter-spacing:.02em;color:var(--fg-0)}
.share-when{font-family:var(--mono);font-size:11px;color:var(--cool);margin-top:3px}
.share-r{text-align:right;flex:none}
.share-mark{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.share-mark .brand-mark{width:16px;height:16px;border-radius:4px}
.share-mark .brand-mark::after{inset:4.5px;border-radius:1px}
.share-mark span{font-size:11.5px;font-weight:600;letter-spacing:.02em;color:var(--fg-1)}
.share-verify{font-family:var(--mono);font-size:9.5px;color:var(--fg-3);margin-top:3px}
.share-acts{display:flex;gap:9px}
.share-acts .btn{flex:1;justify-content:center}

/* ═══════════ IMAGE STAND-INS ═══════════ */
.ph{background:var(--bg-4);position:relative;overflow:hidden}
.ph::before{content:'';position:absolute;inset:0;
  background:
    radial-gradient(68% 78% at 24% 22%, var(--p1), transparent 64%),
    radial-gradient(58% 66% at 80% 74%, var(--p2), transparent 62%),
    radial-gradient(46% 52% at 62% 26%, var(--p3), transparent 58%);
}
.ph::after{content:'';position:absolute;inset:0;
  background:radial-gradient(120% 100% at 50% 0%,transparent 40%,rgba(0,0,0,.30) 100%)}
/* top padding clears the source chip sitting at 9px inset */
.ph-txt{position:absolute;inset:0;padding:34px 14px 14px;z-index:1;
  font-size:14px;line-height:1.45;color:var(--fg-1);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* ═══════════ TOKEN CHART PAGE ═══════════ */
.tp-head{padding:20px 0 4px}
.tp-id{display:flex;align-items:center;gap:14px;margin-top:14px}
.tp-ico{width:46px;height:46px;border-radius:12px;flex:none;display:grid;place-items:center;
  font-family:var(--disp);font-weight:600;font-size:18px;color:var(--ui-accent-ink);
  background:linear-gradient(150deg,var(--ui-accent),var(--heat-2))}
.tp-name{min-width:0}
.tp-name h2{font-family:var(--disp);font-size:22px;font-weight:600;letter-spacing:-.01em;line-height:1.1}
.tp-name .sub{font-size:12.5px;color:var(--fg-2);margin-top:3px}
.tp-name .sub .sym{font-family:var(--mono);color:var(--fg-1)}
.tp-price{margin-left:auto;text-align:right;flex:none}
.tp-price .p{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.tp-price .c{font-family:var(--mono);font-size:12.5px;margin-top:3px;font-variant-numeric:tabular-nums}
.tp-price .c.up{color:var(--cool)} .tp-price .c.down{color:var(--down)}

.tp-lead{display:flex;align-items:center;gap:10px;margin:16px 0;padding:11px 14px;border-radius:10px;
  background:color-mix(in srgb,var(--cool) 8%,transparent);border:1px solid color-mix(in srgb,var(--cool) 26%,transparent)}
.tp-lead .lz{width:7px;height:7px;border-radius:50%;background:var(--cool);box-shadow:0 0 10px var(--cool);flex:none}
.tp-lead .t{font-size:12.5px;color:var(--fg-1)}
.tp-lead .t b{color:var(--cool);font-weight:600;font-family:var(--mono)}

.tp-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:16px}
.tp-stats .b{background:var(--bg-1);padding:12px 14px;min-width:0}
.tp-stats .k{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3)}
.tp-stats .v{font-family:var(--mono);font-size:14px;margin-top:6px;color:var(--fg-0);font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.tp-grid{display:grid;grid-template-columns:minmax(0,1fr) 304px;gap:16px;align-items:start;margin-bottom:40px}
.tp-chart{background:var(--bg-1);border:1px solid var(--line);border-radius:12px;padding:12px}
.tf-row{display:flex;gap:6px;margin-bottom:10px}
.tf{font-family:var(--mono);font-size:12px;color:var(--fg-2);height:30px;padding:0 13px;border-radius:7px;
  border:1px solid transparent;transition:all 120ms var(--std)}
.tf:hover{color:var(--fg-0);background:var(--bg-2)}
.tf[aria-pressed="true"]{background:color-mix(in srgb,var(--ui-accent) 12%,transparent);color:var(--ui-accent);
  border-color:color-mix(in srgb,var(--ui-accent) 34%,transparent)}
.tp-cv-wrap{position:relative;width:100%}
canvas.tp-cv{display:block;width:100%;height:360px;border-radius:8px}

/* trade panel */
.tp-panel{background:var(--bg-1);border:1px solid var(--line);border-radius:12px;padding:15px}
.bs-tog{display:flex;gap:6px;background:var(--bg-0);border:1px solid var(--line);border-radius:10px;padding:4px;margin-bottom:15px}
.bs-tog button{flex:1;height:34px;border-radius:7px;font-weight:600;font-size:13px;color:var(--fg-2);transition:all 120ms var(--std)}
.bs-tog button[aria-pressed="true"][data-side="buy"]{background:var(--act);color:var(--act-ink)}
.bs-tog button[aria-pressed="true"][data-side="sell"]{background:var(--down);color:#1a0206}
.tp-lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3);display:block;margin-bottom:7px}
.amt-wrap{display:flex;align-items:center;gap:10px;background:var(--bg-0);border:1px solid var(--line);border-radius:10px;
  padding:11px 13px;transition:border-color 120ms var(--std)}
.amt-wrap:focus-within{border-color:var(--ui-accent)}
.amt-wrap input{flex:1;background:none;border:0;color:var(--fg-0);font-family:var(--mono);font-size:19px;font-weight:600;outline:none;min-width:0}
.amt-wrap .un{font-family:var(--mono);font-size:13px;color:var(--fg-2);flex:none}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0 15px}
.presets button{border:1px solid var(--line-2);border-radius:8px;height:32px;font-family:var(--mono);font-size:12px;
  color:var(--fg-1);transition:all 120ms var(--std)}
.presets button:hover{border-color:var(--ui-accent);color:var(--ui-accent)}
.presets button.on{border-color:var(--ui-accent);color:var(--ui-accent);background:color-mix(in srgb,var(--ui-accent) 10%,transparent)}
.pfee{display:flex;gap:7px;margin-bottom:15px}
.pfee button{flex:1;border:1px solid var(--line-2);border-radius:8px;height:38px;color:var(--fg-1);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:all 120ms var(--std)}
.pfee button .n{font-size:11.5px;font-weight:600}
.pfee button .f{font-family:var(--mono);font-size:9px;color:var(--fg-3)}
.pfee button.on{border-color:var(--ui-accent);color:var(--ui-accent)}
.pfee button.on .f{color:var(--ui-accent)}
.recap{background:var(--bg-0);border:1px solid var(--line);border-radius:10px;padding:12px 13px;margin-bottom:14px;
  display:flex;flex-direction:column;gap:9px}
.recap .r{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:12.5px}
.recap .r .k{color:var(--fg-2)}
.recap .r .v{font-family:var(--mono);color:var(--fg-1);font-variant-numeric:tabular-nums;text-align:right}
.recap .r.big .v{font-family:var(--disp);font-size:17px;font-weight:500;color:var(--fg-0)}
.recap .r .v.warn{color:var(--down)}
.recap .r .v.ok{color:var(--cool)}
.exec{width:100%;height:44px;border-radius:10px;font-weight:700;font-size:14px;display:flex;align-items:center;
  justify-content:center;gap:8px;transition:all 120ms var(--std)}
.exec.buy{background:var(--act);color:var(--act-ink)}
.exec.buy:hover{background:var(--act-hi);box-shadow:0 0 20px -4px var(--glow)}
.exec.sell{background:var(--down);color:#1a0206}
.exec.sell:hover{filter:brightness(1.08)}

/* ═══════════ RESPONSIVE ═══════════ */
@media (max-width:1320px){
  .workspace{grid-template-columns:minmax(0,1fr) 460px}
}
@media (max-width:1080px){
  .tp-grid{grid-template-columns:1fr}
}
@media (max-width:640px){
  .tp-stats{grid-template-columns:repeat(2,1fr)}
  .tp-price .p{font-size:19px}
}
@media (hover:none){ .note-x{opacity:1} }
@media (max-width:1080px){
  .workspace{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
}
@media (max-width:900px){
  .topbar{grid-template-columns:1fr auto;padding:0 14px;height:auto;min-height:52px;padding-top:10px;padding-bottom:10px}
  .topbar-brand{grid-column:1}
  .topbar-actions{grid-column:2;grid-row:1}
  .topbar-nav{
    grid-column:1/-1;grid-row:2;justify-self:stretch;width:100%;margin-top:8px;
    justify-content:flex-start;gap:20px
  }
  .subbar{padding:0 14px}
  .subbar-stats .stat:nth-child(2){display:none}
}
@media (max-width:760px){
  body{overflow:auto}
  .shell{height:auto;min-height:100vh}
  .workspace{grid-template-columns:1fr;height:auto}
  .main{height:auto}
  .feed{overflow:visible;padding:6px 14px 60px}
  .bar{padding:0 14px;position:sticky;top:0;background:var(--bg-0);z-index:30}
  .subbar{position:sticky;top:52px;z-index:29;background:var(--bg-0)}
  .name-grid{grid-template-columns:1fr}
  .tokens{display:block;overflow-x:auto;white-space:nowrap}
}
@media (max-width:560px){
  /* at phone width the display name costs more than it tells you — the @handle identifies */
  .who{display:none}
  .crow{flex-wrap:wrap;row-gap:6px}
  .at,.when{white-space:nowrap}
  .when{margin-left:auto}
  .card-foot .qmeta{gap:8px 12px}
  .quote-row{gap:10px}
  .quote{padding:11px 12px}
  .qthumb{width:44px;height:44px}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important}
  .heat-fill{transform:scaleX(1)}
}
</style>
</head>
<body>
<div class="shell">

  <header class="topbar">
    <div class="topbar-brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Insidor</span>
    </div>

            <span><i class="sq" style="background:var(--fg-3)"></i>Insidor 10%</span>
          </div>
          <p class="split-note">Creator fees split on-chain at launch. ${E(n.at)} can claim their share whenever — they don't need a wallet to have a balance.</p>
        </div>
      </div>

      <div class="sh-foot">
        <span class="cost">≈ 0.51 SOL total · no Insidor fee</span>
        <button class="deploy-btn" id="go">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg>
          <span id="goLbl">Deploy $${E(n.tick)}</span>
        </button>
      </div>
    </div>
  </div>`;

  const back = $('#back'), tick = $('#tick'), nm = $('#nm'), coll = $('#coll');
  back.addEventListener('mousedown', e=>{ if(e.target===back) close(); });
  back.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', close));

  coll.addEventListener('click', ()=>{ if(coll.dataset.go){ close(); openSearch(n); } });

  back.querySelectorAll('[data-alt]').forEach(c=>c.addEventListener('click',()=>{
    tick.value = c.dataset.alt;
    nm.value = c.dataset.alt[0] + c.dataset.alt.slice(1).toLowerCase();
    back.querySelectorAll('[data-alt]').forEach(x=>x.classList.remove('on'));
    c.classList.add('on');
    recheck();
  }));
  back.querySelectorAll('[data-buy]').forEach(c=>c.addEventListener('click',()=>{
    back.querySelectorAll('[data-buy]').forEach(x=>x.classList.remove('on'));
    c.classList.add('on');
  }));

  let deb;
  function recheck(){
    const v = tick.value.toUpperCase();
    $('#goLbl').textContent = 'Deploy $' + v;
    coll.className = 'coll check';
    coll.innerHTML = '<span>Checking Solana…</span>';
    delete coll.dataset.go;
    clearTimeout(deb);
    deb = setTimeout(()=>{
      const hit = n.coins.find(c=>c.s===v);
      if (hit){
        coll.className='coll taken'; coll.dataset.go = n.id;
        coll.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="m20 20-3.5-3.5"/></svg><span>${n.coins.length} coins already exist — top ${n.coins[0].mc}</span><span class="arr">→</span>`;
      } else {
        coll.className='coll clear';
        coll.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9 17.5 20 6.5"/></svg><span>$${v} is free on Solana</span>`;
      }
    }, 420);
  }
  tick.addEventListener('input', recheck);

  $('#go').addEventListener('click', ()=> filed(n, tick.value.toUpperCase(), nm.value));
  setTimeout(()=>{ tick.focus(); tick.setSelectionRange(99,99); }, 80);
}

/* ═══════════ FILED + THE SHARE CARD ═══════════ */

  sheet.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', close));

function close(){ modalEl.innerHTML=''; }

function openHelp(){
  modalEl.innerHTML = `
  <div class="back" id="back">
    <div class="sheet" style="width:380px" role="dialog" aria-modal="true" aria-label="Shortcuts">
      <div class="sh-top"><span class="sh-kick">Shortcuts</span>
        <button class="icon-btn" data-close aria-label="Close"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="sh-body" style="display:grid;grid-template-columns:auto 1fr;gap:10px 16px;font-size:13px">
        ${[['J / K','Move through the feed'],['D','Deploy the selected narrative'],['F','Find existing coins'],['1 / 2','Research / Trending'],['N','Pull new items'],['Space','Pause the research rail'],['Esc','Close']]
          .map(([k,v])=>`<kbd class="mono" style="border:1px solid var(--line-2);border-radius:5px;padding:2px 7px;font-size:11px;background:var(--bg-2);text-align:center">${k}</kbd><span style="color:var(--fg-1)">${v}</span>`).join('')}
      </div>
    </div>
  </div>`;
  $('#back').addEventListener('mousedown',e=>{if(e.target.id==='back')close();});
  modalEl.querySelector('[data-close]').addEventListener('click', close);
}

/* ═══════════ EVENTS ═══════════ */
feedEl.addEventListener('click', e=>{
  if (e.target.closest('[data-back]')) { S.view='feed'; setActiveTab(S.mode==='hot'?'trending':'research'); renderFeed(); return; }
  const dep = e.target.closest('[data-deploy]');
  if (dep){ const n = N.find(x=>x.id===dep.dataset.deploy); if(n) openDeploy(n); return; }
  const go = e.target.closest('[data-go]');
  if (go){ const n = N.find(x=>x.id===go.dataset.go); if(n) openSearch(n); }
});

railEl.addEventListener('click', e=>{
  const act = e.target.closest('[data-act]');
  const card = e.target.closest('.note');
  if (!card) return;
  const n = N.find(x=>x.id===card.dataset.id);
  if (!act) return;
  e.stopPropagation();
  if (act.dataset.act==='hide'){
    card.style.transition='opacity 160ms var(--std),transform 200ms var(--std)';
    card.style.opacity='0'; card.style.transform='translateX(14px)';
    setTimeout(()=>card.remove(),200);
    return;
  }
  if (!n) return;
  if (act.dataset.act==='deploy') openDeploy(n);
  else if (act.dataset.act==='find' && n.coins.length) openSearch(n);
});

function setMode(m){
  S.mode=m; S.view='feed';
  $('#bLive').setAttribute('aria-pressed', m==='live');
  $('#bHot').setAttribute('aria-pressed', m==='hot');
  $('#barTitle').textContent = m==='hot' ? 'ranked by velocity' : 'newest first';
  setActiveTab(m==='hot'?'trending':'research');
  renderFeed();
}
$('#bLive').addEventListener('click',()=>setMode('live'));
$('#bHot').addEventListener('click',()=>setMode('hot'));
document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{
  const nav=b.dataset.nav;
  if (nav==='trending') setMode('hot');
  else if (nav==='search'){ const n=N.find(x=>x.coins.length); if(n) openSearch(n); }
  else if (nav==='portfolio'){ S.view='feed'; S.mode='live'; setActiveTab('portfolio'); renderFeed(); }
  else setMode('live');
}));

$('#pauseBtn').addEventListener('click',()=>{
  S.paused=!S.paused;
  $('#railSub').textContent = S.paused ? `paused · ${S.held.length}` : 'live';
  if(!S.paused){ S.held.forEach(n=>pushNote(n,false)); S.held=[]; $('#railSub').textContent='live'; }
});
railEl.addEventListener('pointerenter',()=>{ S.paused=true; $('#railSub').textContent='paused'; });
railEl.addEventListener('pointerleave',()=>setTimeout(()=>{
  if(!S.paused) return;
  S.paused=false; S.held.forEach(n=>pushNote(n,false)); S.held=[]; $('#railSub').textContent='live';
},500));

$('#newPill').addEventListener('click', pull);
$('#helpBtn').addEventListener('click', openHelp);
$('#themeBtn').addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme')||'dark';
  const next=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme', next);
  const icon=$('#themeIcon');
  if (icon) icon.innerHTML = next==='dark'
    ? '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>'
    : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>';
});

function pull(){
  if(!S.pending.length) return;
  S.feed = S.pending.reverse().concat(S.feed).slice(0,10);
  S.pending=[]; paintPill();
  renderFeed(S.feed[0].id);
  feedEl.scrollTo({top:0,behavior:'smooth'});
}
function paintPill(){
  const p=$('#newPill');
  p.classList.toggle('hidden', !S.pending.length);
  $('#newN').textContent=S.pending.length;
}

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'){ if(e.key==='Escape') e.target.blur(); return; }
  const k=e.key.toLowerCase();
  if(k==='escape'){ if(modalEl.innerHTML) close(); else if(S.view==='search'){S.view='feed';setActiveTab(S.mode==='hot'?'trending':'research');renderFeed();} return; }
  if(modalEl.innerHTML) return;
  if(k==='1') setMode('live');
  if(k==='2') setMode('hot');
  if(k==='n') pull();
  if(k==='?') openHelp();
  if(k===' '){ e.preventDefault(); $('#pauseBtn').click(); }
  if(k==='j'||k==='k'){
    const cards=[...document.querySelectorAll('.card')];
    if(!cards.length) return;
    S.sel=Math.max(0,Math.min(cards.length-1,S.sel+(k==='j'?1:-1)));
    cards.forEach((c,i)=>c.style.borderColor = i===S.sel?'var(--act)':'');
    cards[S.sel].scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  if(k==='d'||k==='f'){
    const list=S.mode==='hot'?S.feed.slice().sort((a,b)=>b.heat-a.heat):S.feed;
    const n=list[S.sel]; if(!n) return;
    k==='d'?openDeploy(n):(n.coins.length&&openSearch(n));
  }
});

/* ═══════════ LIVE ARRIVALS ═══════════ */
function bump(n){
  const d=new Date();
  return Object.assign({},n,{ t:String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0') });
}
setInterval(()=>{
  if(!S.pool.length) S.pool = N.slice();
  const raw = S.pool.shift(); if(!raw) return;
  const n = bump(raw);

  if(S.paused){ S.held.push(n); $('#railSub').textContent=`paused · ${S.held.length}`; }
  else pushNote(n,true);

  S.today++; $('#stToday').textContent=S.today;

  if(feedEl.scrollTop>10 || S.view!=='feed'){ S.pending.push(n); paintPill(); }
  else { S.feed.unshift(n); if(S.feed.length>10) S.feed.pop(); renderFeed(n.id); }
}, 6500);

/* ═══════════ BOOT ═══════════ */
try {
  S.feed = N.slice(0,5);
  S.pool = N.slice(5).concat(N.slice(0,3));
  renderFeed();
  N.slice(0,4).forEach(n=>pushNote(n,false));
} catch (err) {
  // never fail to a blank screen — say what broke and on what
  feedEl.innerHTML = '<div class="boot-msg"><h4>This prototype didn\'t start</h4>' +
    '<p>Your browser may be a few versions behind. Chrome, Edge, Safari 16.4+ or Firefox 115+ all work.</p>' +
    '<code>' + E(err && err.message ? err.message : String(err)) + '<br>' + E(navigator.userAgent) + '</code></div>';
}
})();
</script>
<iframe id="privySecureCtx" title="Privy secure context" style="display:none" aria-hidden="true"></iframe>
<script type="module">
import Privy, {LocalStorage, createSiwsMessage} from 'https://esm.sh/@privy-io/js-sdk-core@0.68.3';

(function(){
  var appId = document.querySelector('meta[name="privy-app-id"]')?.content?.trim() || '';
  var clientId = document.querySelector('meta[name="privy-client-id"]')?.content?.trim() || '';
  var returnUrl = window.location.origin + window.location.pathname;
  var privy = null;
  var currentUser = null;
  var authMenuOpen = false;
  var msgListener = null;

  function userLabel(user){
    if (!user) return 'Account';
    var linked = user.linkedAccounts || [];
    for (var i = 0; i < linked.length; i++) {
      var a = linked[i];
      if (a.type === 'google_oauth') {
        if (a.name) return a.name;
        if (a.email) return a.email.split('@')[0];
      }
      if (a.type === 'email' && a.address) return a.address.split('@')[0];
      if (a.address) return a.address.slice(0, 4) + '…' + a.address.slice(-4);
    }
    return 'Insidor user';
  }

  function closeAuthMenu(){
    authMenuOpen = false;
    var menu = document.querySelector('.auth-menu');
    if (menu) menu.classList.remove('open');
  }

  function toggleAuthMenu(){
    authMenuOpen = !authMenuOpen;
    var menu = document.querySelector('.auth-menu');
    if (menu) menu.classList.toggle('open', authMenuOpen);
  }

  function isOriginError(err){
    if (!err) return false;
    var msg = err.message || err.error || '';
    return err.code === 'invalid_origin' || /invalid.?origin/i.test(msg);
  }

  function privyErrorMessage(err){
    var msg = (err && (err.message || err.error || err.code)) || String(err || 'Unknown error');
    var origin = window.location.origin;
    if (isOriginError(err)) {
      return 'Add "' + origin + '" to Allowed origins for your Privy app client (Dashboard → Configuration → Clients → your client → Allowed origins). If you use 127.0.0.1, add that origin too.';
    }
    return msg;
  }

  function showAuthError(msg){
    var err = document.getElementById('authErr');
    if (err) err.textContent = msg || '';
    var btn = document.getElementById('privySignInBtn');
    if (btn) btn.title = msg || '';
  }

  function mountSecureContext(){
    if (!privy) return Promise.resolve();
    var iframe = document.getElementById('privySecureCtx');
    if (!iframe) return Promise.resolve();
    return new Promise(function(resolve){
      iframe.onload = function(){
        privy.setMessagePoster(iframe.contentWindow);
        resolve();
      };
      iframe.src = privy.embeddedWallet.getURL();
      if (msgListener) window.removeEventListener('message', msgListener);
      msgListener = function(e){
        if (e.source !== iframe.contentWindow) return;
        var data = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
        privy.embeddedWallet.onMessage(data);
      };
      window.addEventListener('message', msgListener);
    });
  }

  async function initPrivy(useClientId){
    var cfg = {appId: appId, storage: new LocalStorage()};
    if (useClientId && clientId) cfg.clientId = clientId;
    var instance = new Privy(cfg);
    await instance.initialize();
    return instance;
  }

  async function finishOAuthIfNeeded(){
    var params = new URLSearchParams(window.location.search);
    var code = params.get('privy_oauth_code');
    var state = params.get('privy_oauth_state');
    if (!code || !state) return;
    await privy.auth.oauth.loginWithCode(code, state);
    window.history.replaceState({}, '', returnUrl);
    var res = await privy.user.get();
    currentUser = res.user;
  }

  async function signInWithGoogle(){
    showAuthError('');
    closeAuthMenu();
    try {
      var oauthURL = await privy.auth.oauth.generateURL('google', returnUrl);
      window.location.assign(oauthURL);
    } catch (e) {
      console.error(e);
      showAuthError('Google sign-in failed. Enable Google in Privy Dashboard → Login methods.');
      renderAuth();
    }
  }

  async function signInWithSolana(){
    showAuthError('');
    closeAuthMenu();
    try {
      var provider = window.phantom?.solana || window.solana;
      if (!provider) throw new Error('No Solana wallet found. Install Phantom.');
      var conn = await provider.connect();
      var address = conn.publicKey.toBase58();
      var nonceRes = await privy.auth.siws.fetchNonce({address: address});
      var message = createSiwsMessage({
        address: address,
        nonce: nonceRes.nonce,
        domain: window.location.host,
        uri: window.location.origin
      });
      var encoded = new TextEncoder().encode(message);
      var signed = await provider.signMessage(encoded, 'utf8');
      var signature = btoa(String.fromCharCode.apply(null, signed.signature));
      var loginRes = await privy.auth.siws.login({
        message: message,
        signature: signature,
        mode: 'login-or-sign-up'
      });
      currentUser = loginRes.user;
      renderAuth();
    } catch (e) {
      console.error(e);
      showAuthError(e.message || 'Solana sign-in failed. Enable wallet login in Privy Dashboard.');
      renderAuth();
    }
  }

  async function signOut(){
    if (!privy || !currentUser) return;
    await privy.auth.logout({userId: currentUser.id});
    currentUser = null;
    renderAuth();
  }

  function renderAuth(){
    var slot = document.getElementById('userAuth');
    if (!slot) return;

    if (!appId || !clientId) {
      slot.innerHTML = '<button type="button" class="wallet-btn" disabled title="Add Privy App ID and Client ID to the meta tags"><span class="wl">Sign in</span></button>';
      return;
    }

    slot.innerHTML = '';

    if (currentUser) {
      var chip = document.createElement('div');
      chip.className = 'user-chip';
      var nameEl = document.createElement('span');
      nameEl.className = 'user-name';
      nameEl.textContent = userLabel(currentUser);
      var outBtn = document.createElement('button');
      outBtn.type = 'button';
      outBtn.className = 'icon-btn user-logout';
      outBtn.setAttribute('aria-label', 'Log out');
      outBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>';
      outBtn.addEventListener('click', signOut);
      chip.appendChild(nameEl);
      chip.appendChild(outBtn);
      slot.appendChild(chip);
      return;
    }

    var menu = document.createElement('div');
    menu.className = 'auth-menu' + (authMenuOpen ? ' open' : '');
    menu.innerHTML =
      '<button type="button" class="wallet-btn" id="privySignInBtn">' +
        '<span class="wi" aria-hidden="true">' +
          '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/>' +
          '</svg>' +
        '</span>' +
        '<span class="wl">Sign in</span>' +
      '</button>' +
      '<div class="auth-panel" role="dialog" aria-label="Sign in">' +
        '<h3>Sign in</h3>' +
        '<p>Continue with Google or your Solana wallet.</p>' +
        '<button type="button" class="auth-opt google" data-auth="google">' +
          '<span class="ico" aria-hidden="true">' +
            '<svg width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1Z"/><path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23Z"/><path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62Z"/><path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53Z"/></svg>' +
          '</span>Continue with Google' +
        '</button>' +
        '<button type="button" class="auth-opt solana" data-auth="solana">' +
          '<span class="ico" aria-hidden="true">' +
            '<svg width="18" height="18" viewBox="0 0 397.7 311.7"><linearGradient id="sg" x1="360" y1="351" x2="141" y2="-69" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#00FFA3"/><stop offset="1" stop-color="#DC1FFF"/></linearGradient><path fill="url(#sg)" d="M64.6 237.9c2.4-2.4 5.7-3.8 9.2-3.8h317.4c5.8 0 8.7 7 4.6 11.1l-62.7 62.7c-2.4 2.4-5.7 3.8-9.2 3.8H6.5c-5.8 0-8.7-7-4.6-11.1l62.7-62.7z"/><path fill="url(#sg)" d="M64.6 3.8C67.1 1.4 70.4 0 73.8 0h317.4c5.8 0 8.7 7 4.6 11.1l-62.7 62.7c-2.4 2.4-5.7 3.8-9.2 3.8H6.5c-5.8 0-8.7-7-4.6-11.1L64.6 3.8z"/><path fill="url(#sg)" d="M333.1 120.1c-2.4-2.4-5.7-3.8-9.2-3.8H6.5c-5.8 0-8.7 7-4.6 11.1l62.7 62.7c2.4 2.4 5.7 3.8 9.2 3.8h317.4c5.8 0 8.7-7 4.6-11.1l-62.7-62.7z"/></svg>' +
          '</span>Continue with Solana' +
        '</button>' +
        '<div class="auth-err" id="authErr"></div>' +
      '</div>';
    slot.appendChild(menu);

    menu.querySelector('#privySignInBtn').addEventListener('click', function(e){
      e.stopPropagation();
      toggleAuthMenu();
    });
    menu.querySelector('[data-auth="google"]').addEventListener('click', signInWithGoogle);
    menu.querySelector('[data-auth="solana"]').addEventListener('click', signInWithSolana);
  }

  document.addEventListener('click', function(e){
    if (!e.target.closest('.auth-menu')) closeAuthMenu();
  });

  async function bootPrivy(){
    if (location.protocol === 'file:') {
      renderAuth();
      var btn = document.getElementById('privySignInBtn');
      if (btn) btn.title = 'Privy needs a local server — run: npx serve .';
      return;
    }

    if (!appId || !clientId) {
      renderAuth();
      return;
    }

    try {
      try {
        privy = await initPrivy(true);
      } catch (firstErr) {
        if (clientId && isOriginError(firstErr)) {
          console.warn('Privy client origin rejected; retrying with app-level settings only.', firstErr);
          privy = await initPrivy(false);
        } else {
          throw firstErr;
        }
      }
      await mountSecureContext();
      await finishOAuthIfNeeded();
      var res = await privy.user.get();
      currentUser = res.user;
      renderAuth();
    } catch (e) {
      console.error('Privy failed to load:', e);
      renderAuth();
      showAuthError(privyErrorMessage(e));
    }
  }

  bootPrivy();
})();
</script>
</body>
</html>
