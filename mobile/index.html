<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover so the floating tab bar can sit above the home indicator using
         env(safe-area-inset-bottom) rather than a guessed margin. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Nothing here is cacheable or indexable: every number is stale within a tick. The
         same explicit noindex the desktop app carries. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="dark" />
    <title>Insidor</title>

    <!-- The three faces the design names. Inter for everything, Montserrat 700 for the
         wordmark only, JetBrains Mono for addresses. The fallback stacks in tokens.css are
         what render if this origin is unreachable. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&family=Montserrat:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
